[theme]
base = "dark"
primaryColor = "#6366f1"
backgroundColor = "#080c14"
secondaryBackgroundColor = "#111827"
textColor = "#f8fafc"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = true

[browser]
gatherUsageStats = false
